name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
  # evals job lands in v1 step 8: boot pgvector service, run migrations,
  # execute RAGAS against evals/golden_dataset.jsonl, fail PR on regression.
