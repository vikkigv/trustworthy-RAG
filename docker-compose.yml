services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      LLM_API_BASE: http://host.docker.internal:11434/v1
      EMBEDDING_API_BASE: http://host.docker.internal:11434/v1
      LANGFUSE_HOST: http://host.docker.internal:3000
    env_file: .env
    volumes:
      - ./data:/app/data  # document bytes shared with the worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["uv", "run", "arq", "trust_rag.worker.WorkerSettings"]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      LLM_API_BASE: http://host.docker.internal:11434/v1
      EMBEDDING_API_BASE: http://host.docker.internal:11434/v1
      LANGFUSE_HOST: http://host.docker.internal:3000
    env_file: .env
    volumes:
      - ./data:/app/data  # document bytes shared with the api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trust_rag
      POSTGRES_PASSWORD: trust_rag_dev
      POSTGRES_DB: trust_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    # v2: single container, reuses our Postgres + Redis (v3 would need
    # ClickHouse + MinIO — overkill for a 4 GB dev VM).
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trust_rag:trust_rag_dev@postgres:5432/langfuse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: trustrag-dev-nextauth-secret
      SALT: trustrag-dev-salt
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trustrag.dev
      PGADMIN_DEFAULT_PASSWORD: trust_rag_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./infra/docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  pgadmin:
