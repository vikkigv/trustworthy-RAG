services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      HF_HOME: /app/data/hf
    env_file: .env
    volumes:
      - ./data:/app/data  # document bytes shared with the worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["uv", "run", "arq", "trust_rag.worker.WorkerSettings"]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      HF_HOME: /app/data/hf
    env_file: .env
    volumes:
      - ./data:/app/data  # document bytes shared with the api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trust_rag
      POSTGRES_PASSWORD: trust_rag_dev
      POSTGRES_DB: trust_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Langfuse self-host requires ClickHouse + MinIO (v3).
  # Attach the official stack instead of duplicating it here:
  #   curl -L https://raw.githubusercontent.com/langfuse/langfuse/main/docker-compose.yml -o infra/langfuse/docker-compose.yml
  #   docker compose -f infra/langfuse/docker-compose.yml up -d
  # Then set LANGFUSE_ENABLED=true in .env (see docs/langfuse.md).

volumes:
  pgdata:
