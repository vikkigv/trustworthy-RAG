[project]
name = "trust-rag"
version = "0.1.0"
description = "TrustRAG — a trustworthy RAG platform with verified claims, abstention, evals, and temporal queries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "litellm>=1.55",
    "langfuse>=2.60",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.17",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "aiofiles>=25.1.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trust_rag", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
